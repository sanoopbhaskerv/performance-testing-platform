# A browser-only journey test importing an existing Playwright spec.
#
# The MVP imports a reviewed Playwright test by repository, immutable ref and path.
# It does not generate browser scripts.
apiVersion: performance.ameriprise.com/v1alpha1
kind: PerformanceTest

metadata:
  name: proposal-journey
  team: advice-implementation
  application: proposal

spec:
  environment:
    name: performance
    runnerCell: advice-perf-eks
    targetClass: non-production

  sources:
    - name: proposal-browser
      type: playwright
      git:
        repository: ssh://bitbucket/proposal-e2e.git
        # A commit SHA, not a branch. A branch can move after review, which would
        # make the run irreproducible and void the approval.
        ref: 8f121c7a9d4e2b6c1f0a3e5d7c9b8a4f6e2d1c0b
        path: tests/performance/proposal-journey.spec.ts

  workloads:
    - name: browser-experience
      type: browser
      engine: playwright
      sourceRef: proposal-browser
      # Browser sessions are budgeted separately from protocol virtual users and
      # start small: the default is 5, with an initial policy maximum of 20.
      browserUsers: 5
      iterationsPerUser: 3

  objectives:
    - metric: browser.journey.duration
      scope: browser-experience
      percentile: 95
      threshold: 8s

  governance:
    maxDuration: 30m
    approvalPolicy: non-production-standard
    retention: 90d
