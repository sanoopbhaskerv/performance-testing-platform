version: "3.9"

services:
  platform-core:
    image: perfplatform/platform-core:latest
    build:
      context: ../platform-core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/perfplatform
      DB_USER: perf
      DB_PASS: perf
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JMETER_HOME: /opt/jmeter
      MAT_HOME: /opt/mat
      TEAM_CONFIG_DIR: /config/teams
      WORK_DIR: /data/runs
    volumes:
      - ../config:/config:ro # Team YAML configs (read-only)
      - perf-data:/data # JMeter results, reports, dumps
    depends_on:
      postgres:
        condition: service_healthy
    networks: [perf-platform]

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: perfplatform
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [perf-platform]

  prometheus:
    image: prom/prometheus:v2.49.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [perf-platform]

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [perf-platform]

  platform-ui:
    build:
      context: ../platform-ui
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      platform-core:
        condition: service_started
    networks:
      - perf-platform

  demo-service:
    build:
      context: ../demo-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DEMO_DB_URL: jdbc:postgresql://postgres:5432/perfplatform
      DEMO_DB_USER: perf
      DEMO_DB_PASSWORD: perf
    networks:
      - perf-platform
    volumes:
      - perf-data:/data

volumes:
  postgres-data:
  perf-data:
  grafana-data:

networks:
  perf-platform:
    driver: bridge
