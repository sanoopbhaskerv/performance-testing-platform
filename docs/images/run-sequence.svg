<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" style="max-width:100%;height:auto" viewBox="0 0 1600 1070" role="img" aria-labelledby="title description">
<title id="title">One run: definition to verified report</title><desc id="description">The API persists immutable versions and idempotent requests. The reconciler leases work, creates a single Job, reads its evidence and persists the result. Consumers read authorized reports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:bold}.label{font-size:17px}.small{font-size:15px;fill:#475569}.heading{font-size:19px;font-weight:bold}.line{stroke:#475569;stroke-width:2;fill:none}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="45" class="title" text-anchor="start">One run: definition to verified report</text>
<rect x="15" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100.0" y="110" class="heading" text-anchor="middle">Consumer</text>
<line x1="100" y1="135" x2="100" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="245" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="330.0" y="110" class="heading" text-anchor="middle">API</text>
<line x1="330" y1="135" x2="330" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="475" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="560.0" y="110" class="heading" text-anchor="middle">PostgreSQL</text>
<line x1="560" y1="135" x2="560" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="705" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790.0" y="110" class="heading" text-anchor="middle">Reconciler</text>
<line x1="790" y1="135" x2="790" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="935" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1020.0" y="110" class="heading" text-anchor="middle">Runner Job</text>
<line x1="1020" y1="135" x2="1020" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="1165" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1250.0" y="110" class="heading" text-anchor="middle">Object store</text>
<line x1="1250" y1="135" x2="1250" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="1395" y="80" width="170" height="55" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1480.0" y="110" class="heading" text-anchor="middle">Target</text>
<line x1="1480" y1="135" x2="1480" y2="1010" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<polyline points="100,185 330,185" class="line" marker-end="url(#arrow)"/>
<text x="215.0" y="173" class="small" text-anchor="middle">Validate and save</text>
<polyline points="330,240 560,240" class="line" marker-end="url(#arrow)"/>
<text x="445.0" y="228" class="small" text-anchor="middle">Immutable version + digest</text>
<polyline points="100,295 330,295" class="line" marker-end="url(#arrow)"/>
<text x="215.0" y="283" class="small" text-anchor="middle">Trigger + idempotency key</text>
<polyline points="330,350 560,350" class="line" marker-end="url(#arrow)"/>
<text x="445.0" y="338" class="small" text-anchor="middle">QUEUED + event</text>
<polyline points="330,405 100,405" class="line" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="215.0" y="393" class="small" text-anchor="middle">202 Accepted</text>
<polyline points="790,460 560,460" class="line" marker-end="url(#arrow)"/>
<text x="675.0" y="448" class="small" text-anchor="middle">Lease + admission</text>
<polyline points="790,515 1250,515" class="line" marker-end="url(#arrow)"/>
<text x="1020.0" y="503" class="small" text-anchor="middle">Compiled plan + digest</text>
<polyline points="790,570 1020,570" class="line" marker-end="url(#arrow)"/>
<text x="905.0" y="558" class="small" text-anchor="middle">Create Job; persist UID</text>
<polyline points="1020,625 1250,625" class="line" marker-end="url(#arrow)"/>
<text x="1135.0" y="613" class="small" text-anchor="middle">Read approved inputs</text>
<polyline points="1020,680 1480,680" class="line" marker-end="url(#arrow)"/>
<text x="1250.0" y="668" class="small" text-anchor="middle">Bounded workload + correlation ID</text>
<polyline points="1020,735 1250,735" class="line" marker-end="url(#arrow)"/>
<text x="1135.0" y="723" class="small" text-anchor="middle">Progress + final evidence</text>
<polyline points="790,790 1250,790" class="line" marker-end="url(#arrow)"/>
<text x="1020.0" y="778" class="small" text-anchor="middle">Verify identities and read results</text>
<polyline points="790,845 560,845" class="line" marker-end="url(#arrow)"/>
<text x="675.0" y="833" class="small" text-anchor="middle">Objectives + terminal event</text>
<polyline points="100,900 330,900" class="line" marker-end="url(#arrow)"/>
<text x="215.0" y="888" class="small" text-anchor="middle">Read report / download</text>
<polyline points="330,955 100,955" class="line" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="215.0" y="943" class="small" text-anchor="middle">Authorized, verified results</text>
<text x="32" y="1040" class="small" text-anchor="start">Runner Jobs receive no database credentials or control-plane API token. Durable state survives API restarts.</text>
</svg>
