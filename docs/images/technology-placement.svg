<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" style="max-width:100%;height:auto" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
<title id="title">Technology placement</title><desc id="description">The workstation hosts the browser or CLI. The Java modular monolith hosts API, domain, orchestration and adapters. Separate JMeter and Playwright Pods execute workloads.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:bold}.label{font-size:17px}.small{font-size:15px;fill:#475569}.heading{font-size:19px;font-weight:bold}.line{stroke:#475569;stroke-width:2;fill:none}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="45" class="title" text-anchor="start">Technology placement</text>
<rect x="30" y="100" width="300" height="600" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="50" y="129" class="heading" text-anchor="start">Consumer workstation</text>
<rect x="50" y="160" width="260" height="140" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="180.0" y="190" class="heading" text-anchor="middle">Browser</text>
<text x="180.0" y="216" class="label" text-anchor="middle">React 19 + TypeScript</text>
<text x="180.0" y="240" class="label" text-anchor="middle">Vite-built static assets</text>
<text x="180.0" y="264" class="label" text-anchor="middle">Served by the control plane</text>
<rect x="50" y="360" width="260" height="140" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="180.0" y="390" class="heading" text-anchor="middle">AI editor / CI</text>
<text x="180.0" y="416" class="label" text-anchor="middle">Python 3 standard-library CLI</text>
<text x="180.0" y="440" class="label" text-anchor="middle">YAML / JSON specifications</text>
<text x="180.0" y="464" class="label" text-anchor="middle">Same authorized REST API</text>
<rect x="390" y="100" width="580" height="650" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="410" y="129" class="heading" text-anchor="start">Control-plane Pod · platform-core composition root</text>
<rect x="420" y="155" width="520" height="105" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="680.0" y="185" class="heading" text-anchor="middle">API and security</text>
<text x="680.0" y="211" class="label" text-anchor="middle">Spring Boot / Web / Security</text>
<text x="680.0" y="235" class="label" text-anchor="middle">Versioned DTOs · RFC 7807 · OpenAPI</text>
<rect x="420" y="295" width="520" height="105" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="680.0" y="325" class="heading" text-anchor="middle">Domain and engine SPI</text>
<text x="680.0" y="351" class="label" text-anchor="middle">Plain Java · engine-neutral specification</text>
<text x="680.0" y="375" class="label" text-anchor="middle">Immutable identifiers, versions and digests</text>
<rect x="420" y="435" width="520" height="105" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="680.0" y="465" class="heading" text-anchor="middle">Orchestration and results</text>
<text x="680.0" y="491" class="label" text-anchor="middle">Leases · state machine · reconciliation</text>
<text x="680.0" y="515" class="label" text-anchor="middle">Normalized measurements and objectives</text>
<rect x="420" y="575" width="520" height="105" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="680.0" y="605" class="heading" text-anchor="middle">Infrastructure adapters</text>
<text x="680.0" y="631" class="label" text-anchor="middle">Spring Data JPA / Flyway</text>
<text x="680.0" y="655" class="label" text-anchor="middle">S3 SDK / STS · fabric8 Kubernetes client</text>
<polyline points="680,260 680,295" class="line" marker-end="url(#arrow)"/>
<polyline points="680,400 680,435" class="line" marker-end="url(#arrow)"/>
<polyline points="680,540 680,575" class="line" marker-end="url(#arrow)"/>
<text x="680" y="725" class="small" text-anchor="middle">Java 17 target · JDK 21 verified build</text>
<polyline points="330,230 390,230" class="line" marker-end="url(#arrow)"/>
<polyline points="330,430 360,430 360,250 390,250" class="line" marker-end="url(#arrow)"/>
<rect x="1030" y="100" width="340" height="600" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1050" y="129" class="heading" text-anchor="start">Separate runner Pods</text>
<rect x="1050" y="160" width="300" height="140" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1200.0" y="190" class="heading" text-anchor="middle">JMeter 5.6.3</text>
<text x="1200.0" y="216" class="label" text-anchor="middle">JVM + Custom Thread Groups</text>
<text x="1200.0" y="240" class="label" text-anchor="middle">Staged users / arrival rate</text>
<text x="1200.0" y="264" class="label" text-anchor="middle">JTL protocol measurements</text>
<rect x="1050" y="360" width="300" height="140" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1200.0" y="390" class="heading" text-anchor="middle">Playwright 1.62.1</text>
<text x="1200.0" y="416" class="label" text-anchor="middle">Node.js + Chromium</text>
<text x="1200.0" y="440" class="label" text-anchor="middle">Browser / action / page metrics</text>
<text x="1200.0" y="464" class="label" text-anchor="middle">Reports and failure evidence</text>
<text x="1200" y="565" class="label" text-anchor="middle">Dedicated service account</text>
<text x="1200" y="595" class="label" text-anchor="middle">Bounded CPU / memory / deadline</text>
<text x="1200" y="625" class="label" text-anchor="middle">No automatic material-load retry</text>
<polyline points="970,555 1030,555" class="line" marker-end="url(#arrow)"/>
<rect x="390" y="800" width="980" height="90" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.5"/>
<text x="880.0" y="830" class="heading" text-anchor="middle">Operator-owned durable services</text>
<text x="880.0" y="856" class="label" text-anchor="middle">PostgreSQL for state · private S3-compatible storage for artifacts</text>
<polyline points="680,750 680,800" class="line" marker-end="url(#arrow)"/>
<polyline points="1200,700 1200,800" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
