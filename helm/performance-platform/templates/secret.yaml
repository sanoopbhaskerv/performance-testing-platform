{{- if not .Values.database.existingSecret }}
---
# Database credentials secret.
# In production, replace values.yaml username/password with External Secrets
# Operator wired to AWS Secrets Manager — the Secret resource stays, only
# the value source changes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "performance-platform.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.database.username | b64enc | quote }}
  password: {{ .Values.database.password | b64enc | quote }}

{{- end }}
