{{- if .Values.karpenter.enabled }}
---
# Karpenter NodePool for JMeter test job pods.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "{{ .Values.karpenter.nodePool }}"
  labels:
{{ include "performance-platform.labels" . | indent 4 }}
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: "{{ .Values.karpenter.nodePool }}"
    spec:
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values:
            - "{{ .Values.karpenter.capacityType }}"
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "c5.xlarge"
            - "c5.2xlarge"
            - "c6i.xlarge"
            - "c6i.2xlarge"
            - "c6a.xlarge"
            - "c6a.2xlarge"
            - "c7i.xlarge"
        - key: "kubernetes.io/arch"
          operator: In
          values:
            - "amd64"
        - key: "kubernetes.io/os"
          operator: In
          values:
            - "linux"
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: "karpenter.sh/nodepool"
          value: "{{ .Values.karpenter.nodePool }}"
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "64"
    memory: 128Gi

{{- end }}
