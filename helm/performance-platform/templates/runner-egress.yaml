{{- if and .Values.runnerCell.enabled .Values.runnerCell.egress.allowedCidrs }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: performance-runner-egress
  namespace: {{ .Values.runnerCell.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: performance-testing-platform
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.runnerCell.egress.allowedCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
