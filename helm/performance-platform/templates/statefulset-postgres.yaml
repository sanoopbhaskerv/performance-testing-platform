{{- if .Values.postgres.enabled }}
---
# Embedded PostgreSQL StatefulSet — for development / staging only.
# For production on EKS, set postgres.enabled=false and supply an RDS endpoint
# via postgres.externalUrl. RDS handles HA, backups, and failover.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "performance-platform.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "performance-platform.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "performance-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "performance-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: perfplatform
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "performance-platform.databaseSecretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "performance-platform.databaseSecretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "perf"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# Headless service for StatefulSet DNS (postgres-0.perf-platform-postgres)
# and a ClusterIP service for the app to connect to.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "performance-platform.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "performance-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
