---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "performance-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "performance-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "performance-platform.selectorLabels" . | nindent 8 }}
      annotations:
        # Trigger rolling update when team configs or secrets change
        checksum/config: {{ toJson .Values.teamConfigs | sha256sum }}
        checksum/secret: {{ toJson .Values.database | sha256sum }}
        # Prometheus scrape annotations — platform-core exposes /actuator/prometheus
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "performance-platform.serviceAccountName" . }}
      containers:
        - name: platform-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ include "performance-platform.databaseUrl" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "performance-platform.fullname" . }}-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "performance-platform.fullname" . }}-db-credentials
                  key: password
            # ── V2 execution and storage ──────────────────────────────────
            # Production runs workloads as isolated, ephemeral Kubernetes Jobs.
            # The control plane never generates material load itself.
            - name: PLATFORM_ORCHESTRATION_EXECUTIONPROVIDER
              value: "kubernetes"
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_NAMESPACE
              value: {{ .Values.runnerCell.namespace | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_SERVICEACCOUNT
              value: {{ .Values.runnerCell.serviceAccount | quote }}
            {{- range $engine, $image := .Values.runnerCell.images }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_IMAGES_{{ $engine | upper }}
              value: {{ $image | quote }}
            {{- end }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_CPUREQUEST
              value: {{ .Values.runnerCell.resources.cpuRequest | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_CPULIMIT
              value: {{ .Values.runnerCell.resources.cpuLimit | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_MEMORYREQUEST
              value: {{ .Values.runnerCell.resources.memoryRequest | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_MEMORYLIMIT
              value: {{ .Values.runnerCell.resources.memoryLimit | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_WORKSPACESIZELIMIT
              value: {{ .Values.runnerCell.workspaceSizeLimit | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_FINISHEDJOBTTL
              value: {{ .Values.runnerCell.finishedJobTtl | quote }}
            - name: PLATFORM_ORCHESTRATION_RUNNERCELL_DEADLINEGRACE
              value: {{ .Values.runnerCell.deadlineGrace | quote }}

            # Artifacts must be durable and reachable from every replica and
            # every runner. Startup refuses a pod-local filesystem in production.
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_STORE
              value: {{ .Values.artifacts.store | quote }}
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_BUCKET
              value: {{ .Values.artifacts.bucket | quote }}
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_REGION
              value: {{ .Values.artifacts.region | quote }}
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_ENDPOINT
              value: {{ .Values.artifacts.endpoint | quote }}
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_PATHSTYLEACCESS
              value: {{ .Values.artifacts.pathStyleAccess | quote }}
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_RUNNERENDPOINT
              value: {{ .Values.artifacts.runnerEndpoint | quote }}
            # A Secret name, never its contents. Empty where the runner's own
            # projected service-account token is enough, which is the EKS case.
            - name: PLATFORM_ORCHESTRATION_ARTIFACTS_RUNNERCREDENTIALSSECRET
              value: {{ .Values.artifacts.runnerCredentialsSecret | quote }}
            # No object-storage credentials here, by design. The SDK's default
            # provider chain reads them from an IRSA-projected service account
            # token or an instance profile; a key in a values file is a key in
            # source control eventually.

            - name: JMETER_HOME
              value: {{ .Values.jmeter.home | quote }}
            - name: MAT_HOME
              value: {{ .Values.mat.home | quote }}
            # Tell platform-core where to find team configs (mounted ConfigMap)
            - name: TEAM_CONFIG_DIR
              value: "/config/teams"
            # Pass Karpenter node pool name so the orchestrator can set nodeSelector on spawned Jobs
            - name: KARPENTER_NODE_POOL
              value: {{ .Values.karpenter.nodePool | quote }}
            # Kubernetes namespace — used when spawning JMeter Jobs via K8s API
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: team-configs
              mountPath: /config/teams
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.platformCore.requests.cpu }}
              memory: {{ .Values.resources.platformCore.requests.memory }}
            limits:
              cpu: {{ .Values.resources.platformCore.limits.cpu }}
              memory: {{ .Values.resources.platformCore.limits.memory }}
      volumes:
        - name: team-configs
          configMap:
            name: {{ include "performance-platform.fullname" . }}-team-configs
