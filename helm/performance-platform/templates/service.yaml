---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "performance-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "performance-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "performance-platform.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
