---
# ServiceAccount for the platform-core pod.
# Grants permission to create/watch/delete JMeter Job objects so the
# REST API can spawn a new K8s Job per test run programmatically.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "performance-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "performance-platform.fullname" . }}-job-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
rules:
  # Allow platform-core to create/manage JMeter Job objects
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # Allow reading pod logs (for streaming JMeter output to the REST API)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Allow reading ConfigMaps (team configs)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "performance-platform.fullname" . }}-job-manager-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "performance-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "performance-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "performance-platform.fullname" . }}-job-manager
  apiGroup: rbac.authorization.k8s.io
